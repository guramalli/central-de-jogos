<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Torre Colapso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rubik:wght@400;500;600&display=swap">
<script>
// Protótipo: nada aqui pode gravar por cima do save do Torre Infinita (a cena chama save() do jogo principal)
(() => { const set = Storage.prototype.setItem;
  Storage.prototype.setItem = function (k, v) { if (String(k).startsWith('torre-') && !String(k).startsWith('torre-colapso')) return; return set.call(this, k, v); }; })();
</script>
<style>
:root{--ink:#f4efe6;--dim:#b8b0a4;--bg:#14121c;--gold:#f2b630;--green:#6fd08c;--red:#e8553f;--panel:rgba(20,18,30,.88)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Rubik,sans-serif;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100dvh;image-rendering:pixelated;display:block}
h1,h2,h3,button,.num{font-family:"Chakra Petch",sans-serif}
.hud{position:fixed;left:12px;top:12px;right:12px;pointer-events:none;display:flex;flex-direction:column;gap:8px;max-width:420px}
.plate{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;display:flex;align-items:baseline;gap:10px}
.plate b{font-family:"Chakra Petch";font-size:26px;color:var(--gold)}
.plate small{color:var(--dim)}
.hp{position:relative;height:22px;background:var(--panel);border:1px solid rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
#hpFill{position:absolute;inset:0 auto 0 0;transition:width .3s,background .3s}
#hpTxt{position:relative;display:block;text-align:center;line-height:22px;font:700 12px "Chakra Petch";text-shadow:0 1px 2px #000}
.threat{background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:7px 12px;font:600 14px "Chakra Petch";color:var(--gold)}
.threat.off{display:none}
.threat.fatal{border-color:var(--red);color:#fff;background:rgba(150,30,20,.9);animation:pulse .6s infinite alternate}
.threat.now{border-color:var(--red);color:#fff;background:rgba(120,20,20,.92)}
@keyframes pulse{to{transform:scale(1.03)}}
.deck{display:flex;flex-wrap:wrap;gap:3px}
.deck img{width:26px;height:26px;image-rendering:pixelated;background:var(--panel);border-radius:5px;padding:2px}
#dmg{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font:700 64px "Chakra Petch";color:var(--red);text-shadow:0 3px 0 #000;opacity:0;pointer-events:none}
#dmg.pop{animation:pop 1.3s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.offer{position:fixed;inset:0;background:rgba(10,8,16,.55);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:16px 16px 28px;gap:10px}
.offer h2{margin:0;font-size:20px;text-shadow:0 2px 0 #000}
.offer .hint{color:var(--dim);font-size:14px;text-shadow:0 1px 2px #000}
.offer .hint b{color:var(--gold)}
.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}
.card{width:200px;min-height:170px;background:#221f2e;color:var(--ink);border:2px solid #4b4560;border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{transform:translateY(-6px);border-color:var(--gold);outline:none}
.card img{width:40px;height:40px;image-rendering:pixelated}
.card h3{margin:2px 0 4px;font-size:16px}
.card p{margin:0;font-size:13px;font-family:Rubik}
.bom{color:var(--green)} .bom::before{content:"▲ "} .ruim{color:#ff8a78} .ruim::before{content:"▼ "}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,8,16,.6);text-align:center;padding:16px}
.screen h1{margin:0;font-size:44px;color:var(--gold);text-shadow:0 3px 0 #000;letter-spacing:1px}
.screen p{margin:0;max-width:440px;color:var(--ink);text-shadow:0 1px 2px #000;line-height:1.45}
.screen .big{font:700 52px "Chakra Petch";color:#fff}
.btn{font:700 18px "Chakra Petch";background:var(--gold);color:#1b1622;border:0;border-radius:10px;padding:12px 28px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.tag{font:600 12px "Chakra Petch";color:var(--dim);letter-spacing:2px}
@media (max-width:640px){.card{width:calc(33% - 8px);min-height:150px;padding:8px}.card h3{font-size:13px}.card p{font-size:11px}.screen h1{font-size:32px}}
</style>
</head>
<body>
<canvas id="cv" width="360" height="480" aria-label="Torre em construção"></canvas>

<div class="hud" id="hud" hidden>
  <div class="plate"><b id="hAlt">0 m</b><small id="hFloors">0 andares</small><small id="hCity"></small></div>
  <div class="hp"><div id="hpFill"></div><span id="hpTxt">INTEGRIDADE</span></div>
  <div class="threat off" id="threat"></div>
  <div class="deck" id="deck"></div>
</div>
<div id="dmg"></div>

<div class="offer" id="offer" hidden>
  <h2>Escolha uma carta</h2>
  <div class="hint" id="offerHint"></div>
  <div class="cards" id="cards"></div>
</div>

<div class="screen" id="menu">
  <span class="tag">PROTÓTIPO · TORRE INFINITA</span>
  <h1>COLAPSO</h1>
  <p>A torre sobe sozinha. A cada 5 andares você escolhe uma carta. Ventanias e terremotos ficam mais fortes com o tempo: escolha bem antes que a obra desabe.</p>
  <button class="btn" id="btStart">Começar a obra</button>
  <small class="tag" id="menuBest"></small>
</div>

<div class="screen" id="over" hidden>
  <span class="tag">A TORRE DESABOU</span>
  <div class="big" id="oAlt">0 m</div>
  <p id="oInfo"></p>
  <p class="tag" id="oRec"></p>
  <button class="btn" id="btAgain">Tentar de novo</button>
</div>

<script type="module" src="src/colapso/main.js"></script>
</body>
</html>
