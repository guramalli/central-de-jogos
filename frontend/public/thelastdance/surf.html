<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0712">
<meta name="robots" content="noindex, nofollow">
<title>binho_pg_surfer</title>
<meta property="og:title" content="binho_pg_surfer">
<meta property="og:image" content="assets/logo/binho_pg_surfer.webp">
<link rel="stylesheet" href="css/estilo.css">
<link rel="stylesheet" href="css/cena.css">
<style>
  html, body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #tela { touch-action: none; }
  #painel { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top));
            display: flex; flex-wrap: wrap; gap: 6px; font: 600 13px system-ui, sans-serif; }
  #painel a, #painel button { background: rgba(36,21,54,0.88); color: #eee6ff; border: 1px solid #5b3d86;
            border-radius: 8px; padding: 8px 11px; text-decoration: none; cursor: pointer; font: inherit; }
  #painel button[aria-pressed="true"] { background: #b0279a; border-color: #ff5ad8; }
  #caixa { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100vw - 32px));
           max-height: calc(100vh - 32px); overflow: auto; padding: 22px 24px; border-radius: 22px; text-align: center;
           background: rgba(22,13,36,0.94); border: 2px solid #ff5ad8; color: #f3ecff; font: 16px/1.45 system-ui, sans-serif;
           box-shadow: 0 0 30px rgba(255,90,216,0.45); }
  #caixa[hidden] { display: none; }
  #caixa { z-index: 20; }
  #caixa h1 { margin: 0 0 8px; font-size: 26px; color: #ff8be6; text-shadow: 0 0 14px rgba(255,90,216,.6); }
  #caixa p { margin: 0 0 10px; color: #d9cdf2; }
  #caixa ul { text-align: left; margin: 0 0 14px; padding-left: 20px; }
  #caixa li { margin: 3px 0; }
  #caixa .total { font-size: 64px; font-weight: 800; color: #ffd36b; line-height: 1.1; }
  #caixa small { display: block; margin: 6px 0; color: #c9b8ee; }
  #caixa button, #caixa a { display: block; width: 100%; box-sizing: border-box; margin-top: 10px; font: 700 17px system-ui, sans-serif;
           color: #fff; background: #b0279a; border: 2px solid #ff8be6; border-radius: 999px; padding: 12px; cursor: pointer; text-decoration: none; }
  #caixa a { background: transparent; }
  /* ranking */
  #caixa form.nome { display: flex; gap: 8px; margin-top: 12px; }
  #caixa form.nome[hidden] { display: none; }
  #caixa form.nome input { flex: 1; min-width: 0; font: 700 18px system-ui, sans-serif; padding: 10px 14px; border-radius: 999px;
           border: 2px solid #ff8be6; background: #1b1030; color: #fff; }
  #caixa form.nome button { width: auto; margin: 0; padding: 10px 16px; white-space: nowrap; }
  #caixa .msg { color: #ffd36b; font-weight: 700; }
  #caixa h1.logo { margin: -6px 0 4px; } #caixa h1.logo img { width: 100%; max-height: 34vh; object-fit: contain; display: block; }
  @media (max-height: 500px) { #caixa h1.logo img { max-height: 26vh; } }
  /* celular deitado: tudo menor e o ranking ao lado (cabe sem rolar) */
  @media (max-height: 500px) {
    #caixa { width: min(700px, calc(100vw - 24px)); max-height: calc(100vh - 16px); padding: 10px 14px; font-size: 13px; line-height: 1.3; }
    #caixa h1 { font-size: 18px; margin: 0 0 2px; }
    #caixa p { margin: 0 0 4px; }
    #caixa ul { margin: 0 0 6px; }
    #caixa li { margin: 1px 0; }
    #caixa small { margin: 3px 0; }
    #caixa .total { font-size: 34px; }
    #caixa button, #caixa a { font-size: 14px; padding: 8px; margin-top: 6px; }
    #caixa form.nome { margin-top: 6px; }
    #caixa form.nome input { padding: 7px 12px; }
    #caixa form.nome button { padding: 7px 12px; }
    #caixa ol.ranking { margin: 0; }
    #caixa ol.ranking li { padding: 2px 8px; font-size: 13px; }
    #caixa.fim:not([hidden]) { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; align-items: start; }
    #caixa.fim > * { grid-column: 1; }
    #caixa.fim > .lista { grid-column: 2; grid-row: 1 / span 9; }
  }
  #caixa ol.ranking { list-style: none; margin: 8px 0 4px; padding: 0; text-align: left; }
  #caixa ol.ranking li { display: flex; gap: 10px; padding: 5px 10px; border-radius: 10px; }
  #caixa ol.ranking li:nth-child(odd) { background: rgba(255,255,255,0.05); }
  #caixa ol.ranking li.eu { background: rgba(255,90,216,0.35); color: #fff; font-weight: 800; }
  #caixa ol.ranking li.fora { margin-top: 6px; }
  #caixa ol.ranking b { width: 2.6em; color: #ff8be6; }
  #caixa ol.ranking span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #caixa ol.ranking em { font-style: normal; font-weight: 800; color: #ffd36b; }
  /* botões na tela (celular): joystick à esquerda, PULAR à direita */
  #botoes { position: fixed; inset: auto 0 0 0; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-end;
            padding: 0 max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  #botoes[hidden] { display: none; }
  #botoes .joy { position: fixed; left: 0; bottom: 0; width: 46vw; height: 72vh; pointer-events: auto; touch-action: none; }
  #botoes .joy .base { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6); background: rgba(20,10,30,0.28); box-shadow: inset 0 0 18px rgba(0,0,0,0.25); }
  #botoes .joy .pino { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
            background: rgba(255,90,216,0.7); border: 2px solid rgba(255,255,255,0.85); box-shadow: 0 3px 0 rgba(0,0,0,0.35); }
  #botoes .joy.ativo .base { background: rgba(20,10,30,0.4); }
  #botoes .joy.ativo .pino { background: rgba(255,90,216,0.9); }
  #botoes button { pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none; border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.75); background: rgba(20,10,30,0.4); color: #fff; opacity: 0.9; font: 800 26px system-ui, sans-serif;
            box-shadow: 0 3px 0 rgba(0,0,0,0.35); }
  #botoes button.apertado { background: rgba(255,90,216,0.75); transform: translateY(2px); box-shadow: none; }
  #botoes .pular { width: 104px; height: 104px; border-radius: 50%; font-size: 20px; background: rgba(255,90,216,0.55); margin-left: auto; }
  #botoes small { display: block; font-size: 11px; font-weight: 700; }
  /* celular deitado (tela baixa): botões menores e mais transparentes, encostados nos cantos */
  @media (max-height: 500px) {
    #botoes { padding: 0 max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
    #botoes .joy .base { width: 100px; height: 100px; margin: -50px 0 0 -50px; }
    #botoes .joy .pino { width: 46px; height: 46px; margin: -23px 0 0 -23px; }
    #botoes button { font-size: 21px; opacity: 0.7; background: rgba(20,10,30,0.25); }
    #botoes .pular { width: 84px; height: 84px; font-size: 17px; }
  }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<div id="painel">
  <a id="voltar" href="garagem.html?comodo=carro">← Carro</a>
  <button id="som" aria-pressed="true">Som: ligado</button>
</div>
<div id="caixa" role="dialog" aria-label="Surf" hidden></div>
<div id="botoes" hidden>
  <!-- joystick: aparece onde o polegar encosta (metade esquerda da tela) -->
  <div class="joy" id="joy" aria-label="Joystick: direita vai, esquerda volta, cima e baixo sobem e descem a onda">
    <div class="base"><div class="pino"></div></div>
  </div>
  <button class="pular" data-acao="pula" aria-label="Pular">🏄<small>PULAR</small></button>
</div>
<!-- Minigame de surf (js/surf.js). ?direto = pula as instruções -->
<script src="js/base.js"></script>
<script src="js/vip.js"></script>
<script src="js/audio.js"></script>
<script src="personagem_modular/dados.js"></script>
<script src="personagem_modular/personagem-modular.js"></script>
<script src="js/surf.js"></script>
</body>
</html>
